name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sainty.csproj

      - name: Build
        run: dotnet build Sainty.csproj --configuration Release --no-restore

      - name: Publish release package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          dotnet publish Sainty.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
          Compress-Archive -Path publish\* -DestinationPath "Sainty-$version-win-x64.zip" -Force
          Get-FileHash "Sainty-$version-win-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Sainty-${{ github.ref_name }}-win-x64
          path: Sainty-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
